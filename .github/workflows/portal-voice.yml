name: Build Portal Voice preview
on:
  push:
    branches: [portal-voice-0.2]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows,android --org dev.realmbridge .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Publish Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Portal-Voice-Windows-preview
          path: build/windows/x64/runner/Release/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --org dev.realmbridge .
      - run: python3 scripts/configure_android.py
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Portal-Voice-Android-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
  token-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
  geyser-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geyser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Portal-Voice-Geyser-extension-preview
          path: geyser-extension/build/libs/*.jar
